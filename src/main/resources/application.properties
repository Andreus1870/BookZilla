# user_db
user.datasource.name=user_db
user.datasource.url=jdbc:postgresql://localhost:5432/${user.datasource.name}
user.datasource.username=postgres
user.datasource.password=123

# booking_db
booking.datasource.name=booking_db
booking.datasource.url=jdbc:postgresql://localhost:5432/${booking.datasource.name}
booking.datasource.username=postgres
booking.datasource.password=123

# flyway
spring.flyway.enabled=false

# keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/bookzilla
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.additionalQueryStringParams.prompt=login
keycloak.realm=bookzilla

keycloak.admin.server-url=http://localhost:8081
keycloak.admin.realm=master
keycloak.admin.username=admin
keycloak.admin.password=admin
keycloak.admin.client-id=admin-cli