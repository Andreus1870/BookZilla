# user_db
user.datasource.name=user_db
user.datasource.url=jdbc:postgresql://localhost:5432/${user.datasource.name}
user.datasource.username=postgres
user.datasource.password=${USER_DB_PASSWORD}

# booking_db
booking.datasource.name=booking_db
booking.datasource.url=jdbc:postgresql://localhost:5432/${booking.datasource.name}
booking.datasource.username=postgres
booking.datasource.password=${BOOKING_DB_PASSWORD}

# compensation_db
compensation.datasource.name=compensation_db
compensation.datasource.url=jdbc:postgresql://localhost:5434/${compensation.datasource.name}
compensation.datasource.username=compensation_user
compensation.datasource.password=${COMPENSATION_DB_PASSWORD}

# flyway
spring.flyway.enabled=false

# swagger
springdoc.swagger-ui.oauth.use-pkce-with-authorization-code-grant=true
springdoc.swagger-ui.oauth.additionalQueryStringParams.prompt=login
springdoc.swagger-ui.oauth.client-id=bookzilla

# keycloak
keycloak.realm=bookzilla
keycloak.admin.server-url=http://localhost:8081
keycloak.admin.realm=master
keycloak.admin.username=admin
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD}
keycloak.admin.client-id=admin-cli
keycloak.oauth.client-id=bookzilla
keycloak.oauth.token-url=\
  ${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token

# redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# security
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/bookzilla

# retryable operations
bookzilla.retry.fixed-delay=30000

# rate limiting
bookzilla.rate-limit.script-location=scripts/token_bucket.lua